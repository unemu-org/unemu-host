# SPDX-License-Identifier: AGPL-3.0-or-later
[workspace]
resolver = "2"
members = ["crates/machine-view", "crates/test-core"]

[workspace.package]
version = "0.0.4"
edition = "2021"
license = "AGPL-3.0-or-later"
rust-version = "1.99"
repository = "https://github.com/unemu-org/unemu-host"
publish = false

[workspace.dependencies]
# The core contract, pinned by exact revision like every unemu repository.
unemu-core-api = { version = "0.6", git = "https://github.com/unemu-org/unemu-core-api", rev = "a4ec90098e7ca0bc7ce60b2d20af43f140eb3960" }
winit = "0.30"
cpal = "=0.18.2"

[profile.dev]
debug-assertions = true
overflow-checks = true
