# SPDX-License-Identifier: AGPL-3.0-or-later

[advisories]
# As in unemu, vulnerabilities and yanked crates retain cargo-deny's error
# defaults. Only the unmaintained dependency still in this graph is accepted.
ignore = [
    { id = "RUSTSEC-2026-0192", reason = "Accepted 2026-11-11: machine-view -> winit -> sctk-adwaita -> ab_glyph -> owned_ttf_parser -> ttf-parser 0.25.1 provides Wayland client-side decorations, required for window frames on GNOME. This is an unmaintained crate, not a known vulnerability; no safe upgrade is available. Keep winit's default wayland-csd-adwaita feature. Review 2027-05-11." },
]

[licenses]
# Workspace AGPL and the permissive licences of the host dependency graph.
allow = [
    "AGPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/unemu-org/unemu-core-api"]
