[package]
name = "unemu-test-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
description = "A scripted core for the front end's tests: it implements the whole core contract and emulates nothing (§13.3)."

[package.metadata.unemu]
layer = "neutral"

# The contract alone, also for the tests: the crate must stay usable by any
# front-end crate's tests without pulling an emulator in.
[dependencies]
unemu-core-api.workspace = true

[dev-dependencies]
# The contract's storage and content in memory.
unemu-core-api = { workspace = true, features = ["test-support"] }
