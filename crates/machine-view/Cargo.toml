[package]
name = "machine-view"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
description = "The desktop's machine session over the front-end contract: pacing, host audio, keys, pads, pointers, resets, saved state, the screen's geometry (§9.4)."

[package.metadata.unemu]
layer = "neutral"

[features]
# Full-slice advances, a scripted system-key tap and host-audio probes, for
# the tests of the shells built on this crate. It changes no behaviour of a
# binary that inherits it; a shell's tests refuse the host audio device with
# `HostAudio::refuse_device`.
test-support = []

[dependencies]
unemu-core-api.workspace = true
cpal.workspace = true
winit.workspace = true

# The opt-in keyboard tap for system shortcuts, at the versions eframe, rfd
# and arboard already lock, so no new crate enters the build.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFMachPort", "CFRunLoop"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGEvent", "CGEventTypes"] }

[dev-dependencies]
# The session's tests against a whole core, through the contract alone, with
# the contract's storage in memory.
unemu-test-core = { path = "../test-core", version = "0.0.4" }
unemu-core-api = { workspace = true, features = ["test-support"] }

# Synthetic key events for the keyboard tap's decoding tests.
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["CGRemoteOperation"] }
